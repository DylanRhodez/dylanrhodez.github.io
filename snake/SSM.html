<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SIMPLE SNAKE (Mobile)</title>
<style>
  :root {
    --gap: 10px;
    --u: clamp(64px, 22vw, 112px);                         /* size of each on-screen button */
    --pad-h: calc(3 * var(--u) + 2 * var(--gap));
    --cv: min(100vw - 16px, 100vh - var(--pad-h) - 32px, 840px);   /* game window size */
  }
  @supports (height: 100dvh) {
    :root { --cv: min(100vw - 16px, 100dvh - var(--pad-h) - 32px, 840px); }
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body { display: flex; align-items: center; justify-content: center; }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 8px;
    padding: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right))
             calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    box-sizing: border-box;
  }

  canvas {
    display: block;
    width: var(--cv);
    height: var(--cv);
    outline: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Cross-shaped pad: up on top, left / BOOST / right in the middle, down below */
  #pad {
    display: grid;
    grid-template-columns: repeat(3, var(--u));
    grid-template-rows: repeat(3, var(--u));
    gap: var(--gap);
    grid-template-areas:
      ".    up    ."
      "left boost right"
      ".    down  .";
  }
  #btn-up    { grid-area: up; }
  #btn-left  { grid-area: left; }
  #btn-boost { grid-area: boost; }
  #btn-right { grid-area: right; }
  #btn-down  { grid-area: down; }

  .pad-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: #1e3a5f;
    color: #fff;
    border: 3px solid #fff;
    border-radius: 8px;
    font: bold clamp(15px, 4.6vw, 22px) "Courier New", Courier, monospace;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad-btn svg { width: 55%; height: 55%; }
  .pad-btn.pressed, .pad-btn:active {            /* visual feedback: same as the in-game buttons */
    background: #4a90e2;
    border-color: yellow;
    transform: scale(0.93);
  }
  .pad-btn.dim { opacity: 0.35; }
  .rot-l svg { transform: rotate(-90deg); }
  .rot-r svg { transform: rotate(90deg); }
  .rot-d svg { transform: rotate(180deg); }

  /* Landscape (phones on their side, desktop): game on the left, pad on the right */
  @media (min-aspect-ratio: 1/1) {
    :root {
      --u: clamp(64px, 20vh, 112px);
      --pad-w: calc(3 * var(--u) + 2 * var(--gap));
      --cv: min(100vh - 16px, 100vw - var(--pad-w) - 48px, 840px);
    }
    @supports (height: 100dvh) {
      :root { --cv: min(100dvh - 16px, 100vw - var(--pad-w) - 48px, 840px); }
    }
    #app { flex-direction: row; gap: 24px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="1200" height="1200" tabindex="0" aria-label="SIMPLE SNAKE game"></canvas>

  <div id="pad" role="group" aria-label="On-screen controls">
    <button type="button" tabindex="-1" id="btn-up" class="pad-btn" aria-label="Up">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V4M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" tabindex="-1" id="btn-left" class="pad-btn rot-l" aria-label="Left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V4M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" tabindex="-1" id="btn-boost" class="pad-btn" aria-label="Boost"><span>RUN</span></button>
    <button type="button" tabindex="-1" id="btn-right" class="pad-btn rot-r" aria-label="Right">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V4M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" tabindex="-1" id="btn-down" class="pad-btn rot-d" aria-label="Down">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V4M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const VIEW = 600;                          // logical size; the canvas is scaled to fit the screen
let SCALE = canvas.width / VIEW;

function resize() {                        // keep the drawing sharp at any size / pixel ratio
  const dpr = window.devicePixelRatio || 1;
  const css = canvas.clientWidth || VIEW;
  const px = Math.max(300, Math.round(css * dpr));
  if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
  SCALE = canvas.width / VIEW;
}

// ---------- Constants ----------
const STEP = 20;
const BOUND = 280;                         // left/right/bottom limit for the snake's head
const TOP_BOUND = 220;                     // top limit: the strip above is the HUD wall area
const SPAWN_X = [];                        // every column the head can reach
const SPAWN_Y = [];                        // every row the head can reach
for (let x = -BOUND; x <= BOUND; x += STEP) SPAWN_X.push(x);
for (let y = -BOUND; y <= TOP_BOUND; y += STEP) SPAWN_Y.push(y);

const TOP_SPEED = 10;                      // boosted speed can never exceed this...
const MIN_SPEED = 1;
const MIN_BOOST = 1;
const OVERRIDE_MAX = 20;                   // ...unless the dev speed override is on
const DEFAULT_SPEED = 6;
const DEFAULT_BOOST = 2;

const CONTROLS = [
  ["Move", "Tap the arrow buttons, or use the arrow keys or W, A, S, D."],
  ["Boost", "Hold BOOST to speed up. Set the amount in Settings."],
  ["Pause", "Tap PAUSE, or press Space. Press Space again while paused to quit to the menu."],
];

const CREDITS = [
  "Dylan Rhodez, coded with the following resources > Claude Ai, w3schools.com, docs.python-guide.org",
  "Thank you for visiting my site, and thank you for playing!",
];

const KEY_DIR = {
  arrowup: "up", w: "up", arrowdown: "down", s: "down",
  arrowleft: "left", a: "left", arrowright: "right", d: "right",
};
const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

// ---------- State ----------
let speedLevel = DEFAULT_SPEED;            // 1 (slow) .. 9
let boostLevel = DEFAULT_BOOST;            // extra speed points while holding the key
let state = "terminal";                    // terminal, menu, options, credits, dev, playing
let paused = false;
let gameId = 0;                            // identifies the current game so stale timers stop
let titleClicks = 0;                       // clicks on the title; 20 unlocks dev settings
let devUnlocked = false;
let showHitboxes = false;
let showSpots = false;                     // dev: show every possible food spawn position
let speedOverride = false;                 // dev: ignore the speed + boost <= 10 limit
let menuMsg = null;
let score = 0;
let high = 0;
let head = { x: 0, y: 0, dir: "stop" };
let food = { x: 0, y: 100 };
let segments = [];
const held = new Set();                    // directions whose key is currently held
let boostHeld = false;                     // BOOST button is being held
let borderVisible = false;
let uiItems = [];                          // things drawn on top of the game (menus, buttons)
let buttons = [];                          // clickable areas
let flash = null;                          // button currently showing its "pressed" look

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ---------- Speed ----------
const maxSpeed = () => (speedOverride ? OVERRIDE_MAX : TOP_SPEED - 1);
const maxBoost = () => (speedOverride ? OVERRIDE_MAX : TOP_SPEED - speedLevel);

function applyLimits() {
  speedLevel = Math.max(MIN_SPEED, Math.min(maxSpeed(), speedLevel));
  boostLevel = Math.max(MIN_BOOST, Math.min(maxBoost(), boostLevel));
}

function delayMs() {
  const level = speedLevel + (held.has(head.dir) || boostHeld ? boostLevel : 0);
  if (level <= TOP_SPEED) return Math.round(200 - 15 * level);   // 185 ms (1) .. 50 ms (10)
  return Math.max(1, Math.trunc(50 * Math.pow(0.8, level - TOP_SPEED)));
}

// ---------- Drawing (coordinates are centered, y up) ----------
const tx = (x) => VIEW / 2 + x;
const ty = (y) => VIEW / 2 - y;
const fontStr = (size, style) =>
  `${style} ${Math.round(size * 4 / 3)}px "Courier New", Courier, monospace`;

function fillR(x1, y1, x2, y2) {
  ctx.fillRect(tx(x1), ty(y2), x2 - x1, y2 - y1);
}

function drawButton(b, pressed) {
  ctx.fillStyle = pressed ? "#4a90e2" : "#1e3a5f";
  ctx.strokeStyle = pressed ? "yellow" : "white";
  ctx.lineWidth = 3;
  ctx.fillRect(tx(b.x1), ty(b.y2), b.x2 - b.x1, b.y2 - b.y1);
  ctx.strokeRect(tx(b.x1), ty(b.y2), b.x2 - b.x1, b.y2 - b.y1);
  ctx.fillStyle = "white";
  ctx.font = fontStr(18, "bold");
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(b.label, tx(b.cx), ty(b.cy));
}

function drawItem(it) {
  if (it.type === "text") {
    ctx.fillStyle = it.color;
    ctx.font = fontStr(it.size, it.style);
    ctx.textAlign = it.align;
    ctx.textBaseline = it.baseline;
    if (it.angle) {                                       // tilted text: rotate around its anchor
      ctx.save();
      ctx.translate(tx(it.x), ty(it.y));
      ctx.rotate((-it.angle * Math.PI) / 180);            // positive angle = tilted to the left
      ctx.fillText(it.msg, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(it.msg, tx(it.x), ty(it.y));
    }
  } else if (it.type === "rect") {
    ctx.fillStyle = it.fill;
    ctx.strokeStyle = it.stroke;
    ctx.lineWidth = it.width;
    ctx.fillRect(tx(it.x1), ty(it.y2), it.x2 - it.x1, it.y2 - it.y1);
    ctx.strokeRect(tx(it.x1), ty(it.y2), it.x2 - it.x1, it.y2 - it.y1);
  } else {
    drawButton(it.b, false);
  }
}

function drawBorder() {
  ctx.strokeStyle = "#00bfff";
  ctx.lineWidth = 6;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  const e = BOUND + 10;
  ctx.strokeRect(tx(-e), ty(e), 2 * e, 2 * e);
  ctx.beginPath();                          // divider: HUD strip / play area
  ctx.moveTo(tx(-e), ty(TOP_BOUND + 10));
  ctx.lineTo(tx(e), ty(TOP_BOUND + 10));
  ctx.stroke();
}

function drawSpots() {
  ctx.fillStyle = "#00ffff";
  for (const x of SPAWN_X) {
    for (const y of SPAWN_Y) {
      ctx.beginPath();
      ctx.arc(tx(x), ty(y), 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawHitboxes() {
  ctx.fillStyle = "rgba(255, 255, 0, 0.5)";            // 50% opacity yellow
  const e = BOUND + 13, i = BOUND + 7, d = TOP_BOUND + 10;
  fillR(-e, -e, -i, e);                                  // walls
  fillR(i, -e, e, e);
  fillR(-e, -e, e, -i);
  fillR(-e, i, e, e);
  fillR(-e, d - 3, e, d + 3);                            // HUD divider
  for (const s of segments) fillR(s.x - 10, s.y - 10, s.x + 10, s.y + 10);
  fillR(head.x - 10, head.y - 10, head.x + 10, head.y + 10);
  fillR(food.x - 10, food.y - 10, food.x + 10, food.y + 10);
}

function render() {
  resize();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, VIEW, VIEW);

  const playing = state === "playing";
  if (playing && showSpots) drawSpots();
  if (borderVisible) drawBorder();
  if (playing) {
    ctx.fillStyle = "#ff0000";                           // food
    ctx.beginPath();
    ctx.arc(tx(food.x), ty(food.y), 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#008000";                           // body
    for (const s of segments) fillR(s.x - 10, s.y - 10, s.x + 10, s.y + 10);
    ctx.fillStyle = "#00ff00";                           // head
    fillR(head.x - 10, head.y - 10, head.x + 10, head.y + 10);
    if (showHitboxes) drawHitboxes();
    drawItem({ type: "text", msg: `Score: ${score}  High: ${high}`, x: -80, y: 250,
               size: 18, color: "white", style: "normal", align: "center", baseline: "bottom" });
  }
  for (const it of uiItems) drawItem(it);
  if (flash) drawButton(flash, true);
  updatePad();
  requestAnimationFrame(render);
}

// ---------- UI helpers ----------
function clearUI() {
  uiItems = [];
  buttons = [];
}

function text(msg, x, y, size = 18, color = "white", style = "bold",
              align = "center", baseline = "bottom", angle = 0) {
  uiItems.push({ type: "text", msg, x, y, size, color, style, align, baseline, angle });
}

function button(label, cx, cy, cb, w = 200, h = 50) {
  const b = { x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2, cx, cy, label, cb };
  uiItems.push({ type: "button", b });
  buttons.push(b);
}

function flashButton(b) {
  if (flash) return;                                     // ignore clicks during the flash
  flash = b;
  setTimeout(() => {
    flash = null;
    b.cb();
  }, 100);
}

function onClick(x, y) {
  for (const b of buttons) {
    if (x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2) {
      if (b.label === null) b.cb();                      // invisible hit area (title)
      else flashButton(b);
      break;
    }
  }
}

function wrap(str, width) {
  const lines = [];
  let cur = "";
  for (const word of str.split(" ")) {
    if (!cur) cur = word;
    else if ((cur + " " + word).length <= width) cur += " " + word;
    else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------- Screens ----------
function showMenu(message = null) {
  state = "menu";
  menuMsg = message;
  clearUI();
  text("SIMPLE SNAKE", 0, 150, 34, "lime");
  text("Now on mobile!", 205, 205, 12, "yellow", "bold", "center", "bottom", 12);
  buttons.push({ x1: -170, y1: 140, x2: 170, y2: 200, label: null, cb: titleClick });
  if (message) text(message, 0, 100, 16, "yellow");
  button("START", 0, 50, startGame);
  button("SETTINGS", 0, -20, showOptions);
  button("CONTROLS", 0, -90, showControls);
  button("CREDITS", 0, -160, showCredits);
  if (devUnlocked) button("DEV SETTINGS", 0, -230, showDevSettings);
  else if (titleClicks >= 10) text(`${20 - titleClicks} clicks until dev settings`, 0, -245, 16, "yellow");
  // Footer
  text("Ver. 1.0 - 2026/10/17", -275, -282, 9, "gray", "normal", "left");
  text("Simple Snake by Dylan Rhodez", 0, -282, 9, "gray", "normal");
  text("PUBLIC", 275, -282, 9, "gray", "normal", "right");
}

function titleClick() {
  if (devUnlocked) return;
  titleClicks += 1;
  if (titleClicks >= 20) {
    devUnlocked = true;
    showMenu("Developer settings unlocked!");
  } else {
    showMenu(menuMsg);
  }
}

function showDevSettings() {
  state = "dev";
  clearUI();
  text("DEV SETTINGS", 0, 190, 28, "lime");
  button(`HITBOXES: ${showHitboxes ? "ON" : "OFF"}`, 0, 60,
         () => { showHitboxes = !showHitboxes; showDevSettings(); }, 280);
  button(`FOOD SPOTS: ${showSpots ? "ON" : "OFF"}`, 0, -10,
         () => { showSpots = !showSpots; showDevSettings(); }, 280);
  button(`SPEED OVERRIDE: ${speedOverride ? "ON" : "OFF"}`, 0, -80, () => {
    speedOverride = !speedOverride;
    applyLimits();                                       // turning it off pulls values back under 10
    showDevSettings();
  }, 320);
  button("BACK", 0, -180, () => showMenu());
}

function showOptions() {
  state = "options";
  clearUI();
  text("SETTINGS", 0, 190, 32, "lime");
  text(`Speed: ${speedLevel}/${maxSpeed()}`, 0, 120, 22);
  button("-  Slower", -90, 70, () => changeSpeed(-1), 160);
  button("Faster  +", 90, 70, () => changeSpeed(1), 160);
  text(`Boost: +${boostLevel} (max +${maxBoost()})`, 0, 0, 22);
  button("-  Less", -90, -50, () => changeBoost(-1), 160);
  button("More  +", 90, -50, () => changeBoost(1), 160);
  button("RESET DEFAULTS", 0, -115, resetDefaults, 240);
  button("BACK", 0, -180, () => showMenu());
}

function changeSpeed(d) {
  speedLevel += d;
  applyLimits();
  showOptions();
}

function changeBoost(d) {
  boostLevel += d;
  applyLimits();
  showOptions();
}

function resetDefaults() {
  speedLevel = DEFAULT_SPEED;
  boostLevel = DEFAULT_BOOST;
  showOptions();
}

function showControls() {
  state = "controls";
  clearUI();
  text("CONTROLS", 0, 190, 32, "lime");
  let y = 140;
  for (const [label, description] of CONTROLS) {
    text(label, 0, y, 16, "lime");
    y -= 24;
    for (const line of wrap(description, 40)) {
      text(line, 0, y, 14, "white", "normal");
      y -= 24;
    }
    y -= 14;
  }
  button("BACK", 0, -180, () => showMenu());
}

function showCredits() {
  state = "credits";
  clearUI();
  text("CREDITS", 0, 190, 32, "lime");
  let y = 130;
  for (const paragraph of CREDITS) {
    for (const line of wrap(paragraph, 40)) {
      text(line, 0, y, 14, "white", "normal");
      y -= 24;
    }
    y -= 14;
  }
  button("BACK", 0, -180, () => showMenu());
}

// ---------- Game ----------
function go(d) {
  if (state === "playing" && !paused && head.dir !== OPPOSITE[d]) head.dir = d;
}

function drawPauseWindow() {
  uiItems.push({ type: "rect", x1: -150, y1: -120, x2: 150, y2: 100,
                 fill: "#0d1b2a", stroke: "yellow", width: 4 });
  text("PAUSED", 0, 65, 28, "yellow", "bold", "center", "middle");
  button("QUIT TO MENU", 0, 5, quitToMenu, 220);
  button("RESUME", 0, -65, togglePause, 220);
}

function drawHudButton() {
  clearUI();
  if (!paused) button("PAUSE", 215, 260, togglePause, 110, 36);
  else drawPauseWindow();
}

function togglePause() {
  if (state !== "playing") return;
  paused = !paused;
  drawHudButton();
}

function quitToMenu() {
  if (state === "playing" && paused) endGame(false);
}

function startGame() {
  state = "playing";
  paused = false;
  gameId += 1;
  drawHudButton();
  score = 0;
  held.clear();
  head = { x: 0, y: 0, dir: "stop" };
  segments = [];
  food = { x: 0, y: 100 };
  gameLoop(gameId);
}

function endGame(gameOver = true) {
  paused = false;
  segments = [];
  showMenu(gameOver ? `Game over! Score: ${score}` : null);
}

function moveHead() {
  if (head.dir === "up") head.y += STEP;
  else if (head.dir === "down") head.y -= STEP;
  else if (head.dir === "left") head.x -= STEP;
  else if (head.dir === "right") head.x += STEP;
}

const near = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < 20;

function gameLoop(gid) {
  if (gid !== gameId || state !== "playing") return;     // stale timer from an earlier game
  if (paused) {
    setTimeout(() => gameLoop(gid), 50);                 // poll until resumed
    return;
  }

  // Wall collision
  if (Math.abs(head.x) > BOUND || head.y > TOP_BOUND || head.y < -BOUND) {
    endGame();
    return;
  }

  // Eat food
  if (near(head, food)) {
    food = { x: pick(SPAWN_X), y: pick(SPAWN_Y) };
    segments.push({ x: 0, y: 0 });
    score += 10;
    high = Math.max(high, score);
  }

  // Body follows head
  for (let i = segments.length - 1; i > 0; i--) {
    segments[i].x = segments[i - 1].x;
    segments[i].y = segments[i - 1].y;
  }
  if (segments.length) {
    segments[0].x = head.x;
    segments[0].y = head.y;
  }

  moveHead();

  // Self collision
  if (segments.some((s) => near(s, head))) {
    endGame();
    return;
  }

  setTimeout(() => gameLoop(gid), delayMs());
}

// ---------- Fake terminal (shown before the game starts) ----------
let termLines = [];                                      // { msg, color }
let termInput = "";
let termBusy = false;                                    // true while "starting" is showing

function termPrint(msg, color = "lime") {
  termLines.push({ msg, color });
  if (termLines.length > 18) termLines.splice(0, termLines.length - 18);
}

function drawTerminal() {
  clearUI();
  let y = 250;
  for (const l of termLines) {
    text(l.msg, -270, y, 14, l.color, "normal", "left");
    y -= 24;
  }
  if (!termBusy) text("> " + termInput + "_", -270, y, 14, "lime", "normal", "left");
}

function showTerminal() {
  state = "terminal";
  termLines = [];
  termPrint("SIMPLE SNAKE TERMINAL");
  termPrint("");
  drawTerminal();
}

function launchGame() {
  termBusy = false;
  clearUI();
  borderVisible = true;
  showMenu();
}

function termSubmit() {
  const cmd = termInput;
  termInput = "";
  termPrint("> " + cmd, "white");
  const word = cmd.trim().toLowerCase().replace(/[!. ]+$/, "");   // ignore case, spaces, trailing !/.
  if (!word) return;
  if (word === "run") {
    termPrint("LOADING SIMPLE SNAKE");
    termBusy = true;
    setTimeout(launchGame, 1200);
  } else if (word === "help") {
    termPrint("Type RUN to run the game!");
  } else {
    termPrint("ERROR! Type 'help' to show help.", "red");
  }
}

function terminalKey(e) {
  if (termBusy) return;
  if (e.key === "Enter") termSubmit();
  else if (e.key === "Backspace") termInput = termInput.slice(0, -1);
  else if (e.key.length === 1 && termInput.length < 40) termInput += e.key;
  else return;
  e.preventDefault();
  drawTerminal();
}

// ---------- Input ----------
window.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (state === "terminal") {
    terminalKey(e);
    return;
  }
  if (state !== "playing") return;
  const k = e.key.toLowerCase();
  const dir = KEY_DIR[k];
  if (dir) {
    e.preventDefault();
    held.add(dir);
    go(dir);
  } else if (e.key === " ") {
    e.preventDefault();
    if (e.repeat) return;                                // holding space counts as one press
    if (paused) quitToMenu();
    else togglePause();
  }
});

window.addEventListener("keyup", (e) => {
  const dir = KEY_DIR[e.key.toLowerCase()];
  if (dir) held.delete(dir);
});

window.addEventListener("blur", () => held.clear());

canvas.addEventListener("pointerdown", (e) => {
  canvas.focus();
  const r = canvas.getBoundingClientRect();
  onClick(((e.clientX - r.left) / r.width) * VIEW - VIEW / 2,
          VIEW / 2 - ((e.clientY - r.top) / r.height) * VIEW);
});

// ---------- On-screen buttons ----------
const padEls = {
  up: document.getElementById("btn-up"),
  down: document.getElementById("btn-down"),
  left: document.getElementById("btn-left"),
  right: document.getElementById("btn-right"),
  boost: document.getElementById("btn-boost"),
};
const boostLabel = padEls.boost.querySelector("span");
const padState = { label: "", dimArrows: null, dimBoost: null };

// Pressed look + callbacks for press and release. Pointer capture keeps the
// release working even if the finger slides off the button.
function bindHold(el, onDown, onUp) {
  const release = () => { el.classList.remove("pressed"); onUp(); };
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
    el.classList.add("pressed");
    onDown();
  });
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
  el.addEventListener("lostpointercapture", release);
}

for (const dir of ["up", "down", "left", "right"]) {
  bindHold(padEls[dir], () => go(dir), () => {});
}

bindHold(padEls.boost, () => {
  if (state === "terminal") {                             // RUN: types RUN and submits it
    if (!termBusy) { termInput = "RUN"; termSubmit(); drawTerminal(); }
  } else if (state === "playing" && !paused) {
    boostHeld = true;                                     // BOOST: held = faster
  }
}, () => { boostHeld = false; });

function updatePad() {
  const live = state === "playing" && !paused;
  const label = state === "terminal" ? "RUN" : "BOOST";
  if (label !== padState.label) { padState.label = label; boostLabel.textContent = label; }
  const dimArrows = !live;
  const dimBoost = !(live || (state === "terminal" && !termBusy));
  if (dimArrows !== padState.dimArrows) {
    padState.dimArrows = dimArrows;
    for (const d of ["up", "down", "left", "right"]) padEls[d].classList.toggle("dim", dimArrows);
  }
  if (dimBoost !== padState.dimBoost) {
    padState.dimBoost = dimBoost;
    padEls.boost.classList.toggle("dim", dimBoost);
  }
}

// No long-press menus on the game or the buttons
window.addEventListener("contextmenu", (e) => {
  if (e.target === canvas || (e.target.closest && e.target.closest("#pad"))) e.preventDefault();
});

// ---------- Start ----------
showTerminal();
updatePad();
requestAnimationFrame(render);
})();
</script>
</body>
